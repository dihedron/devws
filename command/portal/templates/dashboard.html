<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>// DEVWS Dashboard</title>
    <script>
    document.documentElement.setAttribute(
      'data-bs-theme',
      localStorage.getItem('theme') ?? 'dark'
    );
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'IBM Plex Sans', sans-serif; font-size: .9rem; }

    /* pulsing online dot */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .user-dot {
      display:inline-block; width:8px; height:8px; border-radius:50%;
      background:var(--bs-success); animation:pulse 2s infinite;
    }

    /* table */
    .table thead th {
      font-family:'IBM Plex Mono',monospace;
      font-size:.72rem; text-transform:uppercase; letter-spacing:.08em;
    }
    .table td { font-size:.875rem; vertical-align:middle; }
    .col-actions { width:1%; white-space:nowrap; }

    /* filter panel transition */
    #filter-panel { transition:height .25s ease; }

    /* HTMX loading overlay */
    #table-container { position:relative; }
    .htmx-overlay {
      display:none; position:absolute; inset:0;
      background:rgba(0,0,0,.35); z-index:10;
      align-items:center; justify-content:center;
    }
    .htmx-request .htmx-overlay { display:flex; }
    #detail-body.htmx-request { opacity:.4; transition:opacity .2s; }

    /* offcanvas width */
    #detailCanvas { width:640px; }

    /* VM status badges — keep semantic colors independent of BS theme */
    .badge-running  { background:#1f4a2e; color:#4ade80; }
    .badge-stopped  { background:#2d1f1f; color:#f87171; }
    .badge-paused   { background:#2d2410; color:#fbbf24; }
    .badge-shelved  { background:#2d2410; color:#fbbf24; }
    .badge-unknown  { background:#b18424; color:#000; }

    /* toast */
    @keyframes slideIn { from{transform:translateX(20px);opacity:0} to{transform:translateX(0);opacity:1} }
    .app-toast { animation:slideIn .2s ease; }
  </style>
</head>
<body>

<!-- ═══ NAVBAR ═══════════════════════════════════════════════════════════════ -->
<nav class="navbar navbar-expand px-4 border-bottom sticky-top bg-body-tertiary">
  <span class="navbar-brand fw-semibold text-success font-monospace mb-0 me-auto">
    // VM ADMIN PANEL
  </span>

  <div class="d-flex align-items-center gap-3">
    <span class="font-monospace text-secondary small d-flex align-items-center gap-2">
      <span class="user-dot"></span>{{.Username}}
    </span>

    <!-- dark / light toggle -->
    <button id="theme-btn" class="btn btn-sm btn-outline-secondary border-0"
      title="Toggle theme" onclick="toggleTheme()">
      <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
    </button>

    <button class="btn btn-sm btn-outline-danger font-monospace"
      hx-post="/api/v1/logout" hx-target="body" hx-swap="none">
      <i class="bi bi-box-arrow-right me-1"></i>Logout
    </button>
  </div>
</nav>

<!-- ═══ MAIN ══════════════════════════════════════════════════════════════════ -->
<div class="container-fluid p-4">

  <div class="mb-4">
    <h5 class="font-monospace text-success mb-0">// Resource Management</h5>
    <small class="text-secondary font-monospace">Developers virtual machines</small>
  </div>

  <!-- TABLE CARD -->
  <div class="card border">

    <!-- card header -->
    <div class="card-header d-flex align-items-center justify-content-between py-2">
      <span class="font-monospace text-secondary small text-uppercase">VM List</span>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary font-monospace"
          id="filter-toggle-btn" type="button"
          data-bs-toggle="collapse" data-bs-target="#filter-panel"
          aria-expanded="false" aria-controls="filter-panel">
          <i class="bi bi-funnel me-1"></i>Filters
          <span class="badge bg-success ms-1 d-none" id="filter-badge">0</span>
        </button>
      </div>
    </div>

    <!-- FILTER PANEL (Bootstrap collapse) -->
    <div class="collapse border-bottom" id="filter-panel">
      <div class="card-body bg-body-secondary py-3">
        <div class="row g-3 align-items-end">

          <div class="col-md-2">
            <label class="form-label small font-monospace text-secondary text-uppercase mb-1" for="f-name">Name</label>
            <input type="text" class="form-control form-control-sm font-monospace" id="f-name" placeholder="Search by name…"/>
          </div>

          <div class="col-md-1">
            <label class="form-label small font-monospace text-secondary text-uppercase mb-1" for="f-owner">Owner</label>
            <input type="text" class="form-control form-control-sm font-monospace" id="f-owner" placeholder="Owner…"/>
          </div>

          <div class="col-md-3">
            <label class="form-label small font-monospace text-secondary text-uppercase mb-1" for="f-userid">User ID</label>
            <input type="text" class="form-control form-control-sm font-monospace" id="f-userid" placeholder="Search by userId"/>
          </div>

          <div class="col-md-3">
            <label class="form-label small font-monospace text-secondary text-uppercase mb-1" for="f-image">Image</label>
            <input type="text" class="form-control form-control-sm font-monospace" id="f-image" placeholder="Search by image"/>
          </div>

          <div class="col-md-2">
            <label class="form-label small font-monospace text-secondary text-uppercase mb-1" for="f-status">Status</label>
            <select class="form-select form-select-sm font-monospace" id="f-status">
              <option value="">All</option>
              {{ range $state := vmStates }}
                <option value="{{$state}}">{{$state}}</option>
              {{end}}
            </select>
          </div>

          <div class="col-md-1 d-flex gap-2 align-items-end">
            <button class="btn btn-sm btn-success font-monospace" onclick="applyFilters()">
              <i class="bi bi-search"></i>
            </button>
            <button class="btn btn-sm btn-outline-secondary font-monospace" onclick="resetFilters()">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>

        </div>
      </div>
    </div>

    <!-- TABLE CONTAINER (HTMX target) -->
    <div id="table-container">
      <div class="htmx-overlay"><div class="spinner-border text-success" role="status"></div></div>
      <div
        hx-get="/api/v1/vm?page=1"
        hx-trigger="load"
        hx-target="#table-container"
        hx-swap="innerHTML"
        hx-indicator="#table-container"
      ></div>
    </div>

  </div><!-- /card -->
</div><!-- /container -->

<!-- ═══ MODAL CONFERMA ════════════════════════════════════════════════════════ -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-bottom">
        <h5 class="modal-title font-monospace text-success" id="confirmModalLabel">Confirm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="mb-1" id="modal-message">Confirm operation?</p>
        <small class="text-secondary font-monospace" id="modal-detail"></small>
      </div>
      <div class="modal-footer border-top gap-2">
        <button type="button" class="btn btn-sm btn-outline-secondary font-monospace" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-danger font-monospace" id="modal-confirm-btn">Confirm</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ DETAIL OFFCANVAS ══════════════════════════════════════════════════════ -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="detailCanvas">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title font-monospace text-success">// Virtual Machine Details</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body p-0 d-flex flex-column">
    <div id="detail-body" style="flex:1;overflow-y:auto">
      <div class="p-3 text-secondary font-monospace small">
        Select a VM from the table.
      </div>
    </div>
  </div>
</div>

<!-- ═══ TOAST CONTAINER ═══════════════════════════════════════════════════════ -->
<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script>
  /* ── THEME ──────────────────────────────────────────────────────────────── */
  const root = document.documentElement;
  const themeIcon = document.getElementById('theme-icon');

  function applyTheme(dark) {
    root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
    themeIcon.className = dark ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  }
  function toggleTheme() {
    applyTheme(root.getAttribute('data-bs-theme') !== 'dark');
  }
  applyTheme((localStorage.getItem('theme') ?? 'dark') === 'dark');

  /* ── BOOTSTRAP INSTANCES ─────────────────────────────────────────────────── */
  const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
  const detailCanvas = new bootstrap.Offcanvas(document.getElementById('detailCanvas'));
  let pendingAction = null;

  /* ── CONFIRM MODAL ───────────────────────────────────────────────────────── */
  function openConfirm(action, id, name, page) {
    const messages = {
      stop:     'Stop the selected VM?',
      start:    'Start the selected VM?',
      restart:  'Restart the selected VM?',
      pause:    'Pause the selected VM?',
      unpause:  'Resume the selected VM?',
      shelve:   'Shelve the selected VM?',
      unshelve: 'Unshelve the selected VM?',
      reboot:   'Reboot the selected VM?',
    };
    const labels = {
      stop:     '// Stop VM',
      start:    '// Start VM',
      restart:  '// Restart VM',
      pause:    '// Pause VM',
      unpause:  '// Resume VM',
      shelve:   '// Shelve VM',
      unshelve: '// Unshelve VM',
      reboot:   '// Reboot VM',
    };
    const dangerOps = ['stop', 'shelve', 'reboot'];

    document.getElementById('modal-message').textContent    = messages[action] ?? 'Confirm operation?';
    document.getElementById('modal-detail').textContent     = `ID: ${id}  |  ${name}`;
    document.getElementById('confirmModalLabel').textContent = labels[action] ?? '// Confirm';

    const btn = document.getElementById('modal-confirm-btn');
    btn.className = dangerOps.includes(action)
      ? 'btn btn-sm btn-danger font-monospace'
      : 'btn btn-sm btn-success font-monospace';

    pendingAction = { action, id, name, page };
    confirmModal.show();
  }

  document.getElementById('modal-confirm-btn').addEventListener('click', () => {
    if (!pendingAction) return;
    confirmModal.hide();
    htmx.ajax('POST', `/api/v1/vm/${pendingAction.id}/${pendingAction.action}?page=${pendingAction.page}`, {
      target: '#table-container',
      swap:   'innerHTML',
    });
    showToast(`Operation "${pendingAction.action}" executed on: ${pendingAction.name}`);
    pendingAction = null;
  });

  /* ── LOGOUT ──────────────────────────────────────────────────────────────── */
  document.body.addEventListener('htmx:afterRequest', evt => {
    if (evt.detail.pathInfo.requestPath === '/api/v1/logout') window.location.href = '/';
  });

  /* ── TOAST ───────────────────────────────────────────────────────────────── */
  function showToast(msg) {
    const el = document.createElement('div');
    el.className = 'toast show align-items-center text-bg-success border-0 app-toast mb-2';
    el.innerHTML = `<div class="d-flex"><div class="toast-body font-monospace small">✓ ${msg}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="this.closest('.toast').remove()"></button></div>`;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }

  /* ── FILTERS ─────────────────────────────────────────────────────────────── */
  function getFilterParams() {
    return new URLSearchParams({
      page:   1,
      name:   document.getElementById('f-name').value.trim(),
      owner:  document.getElementById('f-owner').value.trim(),
      userid: document.getElementById('f-userid').value.trim(),
      image:  document.getElementById('f-image').value.trim(),
      status: document.getElementById('f-status').value,
    }).toString();
  }

  function applyFilters() {
    updateFilterBadge();
    htmx.ajax('GET', `/api/v1/vm?${getFilterParams()}`, { target:'#table-container', swap:'innerHTML' });
  }

  function resetFilters() {
    ['f-name','f-owner','f-userid','f-image'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-status').value = '';
    updateFilterBadge();
    htmx.ajax('GET', '/api/v1/vm?page=1', { target:'#table-container', swap:'innerHTML' });
  }

  function updateFilterBadge() {
    const vals = ['f-name','f-owner','f-userid','f-image','f-status']
      .map(id => document.getElementById(id).value.trim())
      .filter(Boolean).length;
    const b = document.getElementById('filter-badge');
    b.classList.toggle('d-none', vals === 0);
    b.textContent = vals;
  }

  ['f-name','f-owner','f-userid','f-image','f-status'].forEach(id =>
    document.getElementById(id).addEventListener('change', updateFilterBadge));
  ['f-name','f-owner','f-userid','f-image'].forEach(id =>
    document.getElementById(id).addEventListener('input', updateFilterBadge));
</script>
</body>
</html>
