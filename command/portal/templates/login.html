<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>// DEVWS Login</title>
    <script>
    document.documentElement.setAttribute(
      'data-bs-theme',
      localStorage.getItem('theme') ?? 'dark'
    );
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-card { width:100%; max-width:400px; }
    .brand-bar { height:3px; background:var(--bs-success); border-radius:4px 4px 0 0; }
    @keyframes slideIn { from{transform:translateX(20px);opacity:0} to{transform:translateX(0);opacity:1} }
    .app-toast { animation:slideIn .2s ease; }
  </style>
</head>
<body>

  <!-- theme toggle top-right -->
  <div class="position-fixed top-0 end-0 p-3">
    <button id="theme-btn" class="btn btn-sm btn-outline-secondary border-0" onclick="toggleTheme()" title="Tema">
      <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
    </button>
  </div>

  <div class="login-card">
    <div class="brand-bar"></div>
    <div class="card rounded-0 rounded-bottom border-top-0">
      <div class="card-body p-4">

        <div class="font-monospace text-success mb-1">// VM ADMIN PANEL</div>
        <div class="font-monospace text-secondary small mb-4">Domain credentials authentication</div>

        <div id="login-error"></div>

        <form hx-post="/api/v1/auth/login" hx-target="#login-error" hx-swap="innerHTML">
          <div class="mb-3">
            <label class="form-label small font-monospace text-secondary text-uppercase" for="username">Username</label>
            <input type="text" class="form-control font-monospace" id="username" name="username"
              autocomplete="username" required placeholder="admin"/>
          </div>
          <div class="mb-4">
            <label class="form-label small font-monospace text-secondary text-uppercase" for="password">Password</label>
            <input type="password" class="form-control font-monospace" id="password" name="password"
              autocomplete="current-password" required placeholder="••••••••"/>
          </div>
          <button type="submit" class="btn btn-success w-100 font-monospace">
            <span class="htmx-indicator spinner-border spinner-border-sm me-1" role="status"></span>
            Login
          </button>
        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script>
    const root = document.documentElement;
    const icon = document.getElementById('theme-icon');

    function applyTheme(dark) {
      root.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      icon.className = dark ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }
    function toggleTheme() { applyTheme(root.getAttribute('data-bs-theme') !== 'dark'); }
    applyTheme((localStorage.getItem('theme') ?? 'dark') === 'dark');

    document.body.addEventListener('htmx:beforeSwap', function(evt) {
    if (evt.detail.xhr.status === 401) {
      evt.detail.shouldSwap = true;  // allow the swap
      evt.detail.isError = false;    // don't treat as error
    }
  });

    document.body.addEventListener('htmx:afterRequest', evt => {
      if (evt.detail.pathInfo.requestPath === '/login' && evt.detail.xhr.status === 200) {
        const redirect = evt.detail.xhr.getResponseHeader('HX-Redirect');
        if (redirect) window.location.href = redirect;
      }
    });
  </script>
</body>
</html>
